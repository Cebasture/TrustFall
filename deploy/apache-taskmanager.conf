# CSRF scenario — Apache front proxy
# Serves the built React SPA from /var/www/html and reverse-proxies /api to the
# Node backend on 127.0.0.1:3000. Deployed to
# /etc/apache2/sites-available/taskmanager.conf
#
# Requires: a2enmod proxy proxy_http rewrite headers
<VirtualHost *:80>
    ServerName newtbug.local
    DocumentRoot /var/www/html

    # --- API reverse proxy -------------------------------------------------
    # Keep /api on the same origin as the SPA so the session cookie is first-party.
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # --- Static SPA + client-side routing ----------------------------------
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Serve real files (incl. /assets/users.json) directly; otherwise fall
        # back to index.html so React Router handles /login, /dashboard, etc.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/taskmanager_error.log
    CustomLog ${APACHE_LOG_DIR}/taskmanager_access.log combined
</VirtualHost>
